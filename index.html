<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thank you, Friends of Korea</title>
<style>
:root{
  --navy:#233A52; --navy2:#3B5673; --ivory:#F3F0E8; --paper:#FBF8F0; --line:#DBD5C2;
  --gold:#A9741E; --ink:#1C1B17; --soft:#57544A; --rose:#C0564B; --ok:#2E6B4C;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;background:var(--ivory);color:var(--ink);font-size:17px}
button{font-family:inherit;cursor:pointer}
.top{background:var(--navy);color:#fff;padding:10px 24px;display:flex;align-items:center;gap:18px}
.top .brand{font-family:Georgia,"Noto Serif KR",serif;font-size:21px;letter-spacing:.5px}
.top .headline{font-family:Georgia,serif;font-size:13px;letter-spacing:2px;color:#B8C7DA;border-left:1px solid #5A7491;padding-left:18px;flex:1}
.top .who{font-size:14px;color:#D6DEE8}
.top button{background:transparent;border:1px solid #5A7491;color:#D6DEE8;border-radius:8px;padding:5px 12px;font-size:13px}
.demo{background:#FFF3D6;color:#7A5A12;text-align:center;font-size:13px;padding:4px}
main{padding:18px 24px 30px;max-width:1280px;margin:0 auto}
.btn{background:var(--navy);color:#fff;border:0;border-radius:12px;padding:12px 26px;font-size:18px;font-weight:700}
.btn:hover{background:var(--navy2)}
.btn.ghost{background:#fff;color:var(--navy);border:2px solid var(--navy)}
.btn.gold{background:var(--gold)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.small{font-size:14px;color:var(--soft)}
.steps{display:flex;gap:8px;margin-bottom:14px}
.steps span{flex:1;text-align:center;padding:6px;border-radius:999px;background:#E6E0CF;color:var(--soft);font-size:14px}
.steps span.on{background:var(--navy);color:#fff;font-weight:700}

/* entry */
.entry{max-width:620px;margin:50px auto;background:#fff;border:1px solid var(--line);border-radius:18px;padding:34px 40px;text-align:center}
.entry h1{font-family:Georgia,serif;margin:0 0 4px;color:var(--navy);font-size:34px}
.entry p{color:var(--soft);margin:4px 0 22px}
.entry label{display:block;text-align:left;font-weight:700;margin:14px 0 4px;font-size:15px}
.entry input{width:100%;font-size:22px;padding:10px 14px;border:2px solid var(--line);border-radius:10px;text-transform:uppercase}
.entry .row{display:flex;gap:14px}
.entry .row>div{flex:1}

/* write */
.write{display:grid;grid-template-columns:1.25fr 1fr;gap:22px}
.card{background:var(--paper);border:1px solid #D8CFB5;border-radius:6px;padding:26px 32px;font-family:Georgia,"Noto Serif KR",serif;font-size:22px;line-height:1.9;position:relative;box-shadow:0 3px 10px rgba(35,58,82,.12);min-height:340px}
.card .stk{position:absolute;right:16px;top:10px;font-size:44px}
.card .ln{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.card input{font-family:inherit;font-size:21px;border:0;border-bottom:2px dashed #A9A38F;background:rgba(255,255,255,.55);padding:0 6px;flex:1;min-width:150px;color:var(--navy)}
.card input:focus{outline:none;border-bottom:2px solid var(--gold);background:#fff}
.card .from{text-align:right;margin-top:6px;font-size:19px;color:var(--soft)}
.bg-hanji{background:#FBF4E2}
.bg-news{background:#EDEBE4;background-image:repeating-linear-gradient(0deg,rgba(0,0,0,.05) 0 1px,transparent 1px 22px)}
.bg-blue{background:#E6EEF6}
.bg-rose{background:#FAEBE8}
.panel{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.panel h3{margin:0 0 8px;color:var(--navy);font-size:17px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--ivory);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:16px}
.chip:hover{background:#E9E2CC}
.chip small{color:var(--soft);font-size:12px;margin-left:4px}
.hint{background:#EEF3F8;border-radius:10px;padding:10px 14px;font-size:14px;color:var(--navy);margin-bottom:12px}
.actions{display:flex;justify-content:space-between;align-items:center;margin-top:16px}
.warn{color:var(--rose);font-size:14px;min-height:20px}

/* help */
.aires .en{font-family:Georgia,serif;font-size:1.15em;margin:4px 0;color:var(--navy)}.aires.ok{color:var(--ok);font-weight:700}.aires .tip{background:#EEF3F8;border-radius:8px;padding:6px 10px;margin:6px 0;font-size:14px}
.tosel{font-family:inherit;font-size:inherit;border:2px solid #A9A38F;border-radius:8px;background:#fff;color:var(--navy);padding:0 6px}
.ck{color:#B5651D;font-size:13px;min-height:4px;font-family:"Noto Sans KR",sans-serif;line-height:1.3;margin:-4px 0 4px}
.ideas{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.idea{text-align:left;background:#FFF9E8;border:1px solid #E3D3A3;border-radius:10px;padding:8px 10px;font-size:14px}
.idea:hover{background:#FFF1C9}
.idea b{display:block;color:var(--navy);font-size:14px}
.idea span{display:block;color:var(--soft);font-family:Georgia,serif;font-size:13px;margin-top:2px}
.actions2{display:flex;gap:10px;margin-top:10px}
.helpbar{background:#FFF1C9;border:2px solid #E3C25A;border-radius:12px;padding:8px 14px;margin-bottom:12px;font-size:15px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.helpbar button{border:1px solid #C9A63D;background:#fff;border-radius:999px;padding:2px 10px;font-size:14px}
.editf{display:block;width:100%;font-size:16px;padding:6px 10px;border:2px solid var(--line);border-radius:8px;margin:4px 0 10px;font-family:Georgia,serif}
/* decorate */
.deco{display:grid;grid-template-columns:1.25fr 1fr;gap:22px}
.swatches{display:flex;gap:12px;flex-wrap:wrap}
.sw{width:84px;height:60px;border-radius:10px;border:3px solid transparent;font-size:12px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:2px}
.sw.on{border-color:var(--gold)}
.stks{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.stkb{font-size:34px;background:#fff;border:3px solid transparent;border-radius:12px;padding:2px 10px}
.stkb.on{border-color:var(--gold);background:#FFF6DE}

/* wall */
.wallhead{display:flex;align-items:center;gap:16px;margin-bottom:14px;flex-wrap:wrap}
.wallhead h2{margin:0;font-family:Georgia,serif;color:var(--navy);font-size:28px}
.progress{background:#fff;border:2px solid var(--line);border-radius:999px;padding:5px 16px;font-size:15px}
.progress.done{border-color:var(--ok);color:var(--ok);font-weight:700}
.wall{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.mini{border:1px solid #D8CFB5;border-radius:6px;padding:14px 16px;font-family:Georgia,serif;font-size:15px;line-height:1.55;cursor:pointer;position:relative;min-height:190px;box-shadow:0 2px 6px rgba(0,0,0,.1);transition:transform .1s}
.mini:hover{transform:translateY(-3px) rotate(-.4deg)}
.mini .stk{position:absolute;right:-6px;top:-14px;font-size:28px}
.mini .meta{position:absolute;left:14px;bottom:8px;right:14px;display:flex;justify-content:space-between;font-family:"Noto Sans KR",sans-serif;font-size:13px;color:var(--soft)}
.mini.read{outline:3px solid #CFE3D6}
.mini.mine{outline:3px solid var(--gold)}
.mini.hid{opacity:.4}
.mini.pin::before{content:"📌";position:absolute;left:-6px;top:-10px;font-size:22px}
.tbar{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap;font-family:"Noto Sans KR",sans-serif}
.tbar button{font-size:12px;border:1px solid var(--line);background:#fff;border-radius:6px;padding:2px 8px}
.empty{text-align:center;padding:70px 20px;color:var(--soft);font-size:19px}

/* modal */
.mask{position:fixed;inset:0;background:rgba(20,30,45,.6);display:flex;align-items:center;justify-content:center;padding:20px;z-index:20}
.modal{background:#fff;border-radius:18px;padding:20px 24px;max-width:860px;width:100%;max-height:94vh;overflow:auto}
.modal .card{min-height:0;font-size:24px}
.react{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:14px}
.heart{font-size:30px;background:#fff;border:2px solid var(--line);border-radius:14px;padding:4px 16px}
.heart.on{background:#FDECEA;border-color:var(--rose)}
.notes{margin-top:10px}
.notes .chip.on{background:var(--navy);color:#fff}
.notes input{font-size:16px;padding:6px 10px;border:2px solid var(--line);border-radius:8px;width:100%;margin-top:8px}
.spot{position:fixed;inset:0;background:var(--navy);z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px}
.spot .card{font-size:clamp(24px,3.4vw,40px);max-width:1000px;width:100%;line-height:1.8;min-height:0}
.spot .ctl{margin-top:20px;display:flex;gap:14px;color:#fff;align-items:center}
.note-line{font-size:14px;color:var(--soft);margin-top:6px}
footer{text-align:center;color:var(--soft);font-size:12px;padding:18px}

/* ===== 크롬북 가로 화면 최적화 (스크롤 없이 한 화면) ===== */
html,body{height:100%;overflow:hidden}
body{display:flex;flex-direction:column;font-size:clamp(14px,2.3vh,17px)}
.top{padding:6px 18px;gap:14px;flex:none}
.top .brand{font-size:clamp(16px,3vh,21px)}
main{flex:1;min-height:0;width:100%;max-width:1400px;padding:8px 20px 4px;display:flex;flex-direction:column}
#app{flex:1;min-height:0;display:flex;flex-direction:column}
.steps{margin-bottom:8px;flex:none}.steps span{padding:3px;font-size:13px}
.write,.deco{flex:1;min-height:0;gap:16px;grid-template-rows:minmax(0,1fr)}
.write>*,.deco>*{min-height:0;overflow:auto}
.card{font-size:clamp(16px,3.1vh,22px);line-height:1.75;padding:clamp(10px,2.4vh,26px) 28px;min-height:0}
.card input{font-size:clamp(15px,2.9vh,21px)}
.panel{padding:12px 16px}
.actions{flex:none;margin-top:8px}
.actions .btn,.btn{padding:clamp(6px,1.4vh,12px) 24px;font-size:clamp(15px,2.6vh,18px)}
.entry{margin:auto;padding:24px 36px}
.wallhead{flex:none;margin-bottom:8px}
.wall{flex:1;min-height:0;overflow:auto;align-content:start;padding:6px 6px 14px}
.empty{padding:6vh 20px}
footer{flex:none;padding:2px 0 4px;font-size:11px}
.modal .card{font-size:clamp(17px,3.4vh,24px)}
.modal{max-height:92vh}
.ideas .idea{padding:6px 8px}
.ck{margin:-2px 0 2px}
@media (max-height:640px){ .top .headline{display:none} .steps{display:none} }

/* ===== 새 기능용 스타일 ===== */
.kobox{width:100%;font-family:inherit;font-size:16px;padding:8px 10px;border:2px solid var(--line);border-radius:10px;resize:none;height:clamp(52px,9vh,80px)}
.opt{background:#FFF9E8;border:1px solid #E3D3A3;border-radius:10px;padding:8px 10px;margin-top:8px}
.opt .en{font-family:Georgia,serif;font-size:1.1em;color:var(--navy)}
.opt .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:6px}
.wchip{background:#fff;border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:14px;cursor:grab}
.wchip small{color:var(--soft);font-size:11px;margin-left:3px}
.wchip:hover{background:#F3EBD2}
.mini2{padding:3px 12px;font-size:14px}
.tok{border-bottom:2px dotted #A9A38F;cursor:pointer}
.tok:hover{background:#FFF1C9}
.gloss{background:#233A52;color:#fff;border-radius:12px;padding:8px 14px;margin-top:10px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;min-height:44px}
.gloss b{font-family:Georgia,serif;font-size:1.2em}
.gloss button{background:#fff;color:var(--navy);border:0;border-radius:8px;padding:2px 10px}
.rec{display:grid;grid-template-columns:1.2fr 1fr;gap:18px;flex:1;min-height:0}
.rec>*{min-height:0;overflow:auto}
.recbtn{font-size:20px;border:0;border-radius:999px;padding:12px 26px;color:#fff;background:var(--rose);font-weight:700}
.recbtn.stop{background:#333}
.meter{height:8px;background:#E6E0CF;border-radius:8px;overflow:hidden;margin:10px 0}
.meter i{display:block;height:100%;width:0;background:var(--rose)}
.drop{outline:3px dashed var(--gold)!important}
.audio-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:10px}
.sp{font-size:.9em}

.mapview{display:flex;flex-direction:column;height:100%;min-height:0}
.maphead{display:flex;align-items:center;gap:16px;margin-bottom:8px}
.maphead h2{margin:0;font-family:Georgia,"Noto Serif KR",serif;color:var(--navy,#233A52)}
.mapbody{display:grid;grid-template-columns:1fr 300px;gap:18px;flex:1;min-height:0}
.mapsvg{height:100%;width:100%;min-height:0;background:#F6F2E7;border:1px solid #D8CFB5;border-radius:10px}
.mapside{display:flex;flex-direction:column;gap:12px;justify-content:center}
.mapside .big{font-size:clamp(40px,10vh,76px);font-weight:700;line-height:1;color:#233A52;font-family:Georgia,serif}
.mapside .bar{height:12px;background:#E5DEC8;border-radius:8px;overflow:hidden}.mapside .bar i{display:block;height:100%;background:#A9741E}
.mapside .leg{font-size:14px;color:#5B6B7B}
@keyframes pl{0%,100%{opacity:1}50%{opacity:.35}} .pulse{animation:pl 1.6s infinite}
.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}.dcard{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px}.dash{max-width:1000px;margin:0 auto;padding:6px 20px}
</style>
</head>
<body>
<div id="demoBar" class="demo" style="display:none">DEMO · 이 브라우저에만 저장됩니다. Supabase 설정 후에는 반 전체가 같은 벽을 봅니다.</div>
<div class="top">
  <div class="brand">Thank you, Friends of Korea.</div>
  <div class="headline">푸른눈의 독립운동가들에게 고마운 마음을 전해요.</div>
  <div class="who" id="who"></div>
  <button id="teacherBtn">교사</button>
  <button id="outBtn" style="display:none">나가기</button>
</div>
<main id="app"></main>
<footer>Tr. Olivia · 백년길</footer>
<div id="modalRoot"></div>

<script>
/* ===== QR 코드 (외부 라이브러리 없이) ===== */
/* 아주 작은 QR 코드 생성기 (바이트 모드, 오류정정 M, 버전 1~10). 외부 라이브러리 없이 동작해요 */
function makeQR(text){
  const data=Array.from(new TextEncoder().encode(text));
  const ECC=[0,10,16,26,18,24,16,18,22,22,26], BLK=[0,1,1,1,2,2,4,4,4,5,5];
  const raw=v=>{ let r=(16*v+128)*v+64; if(v>=2){ const a=Math.floor(v/7)+2; r-=(25*a-10)*a-55; if(v>=7) r-=36; } return Math.floor(r/8); };
  let ver=1; for(;ver<=10;ver++){ const cap=raw(ver)-ECC[ver]*BLK[ver]; if(data.length+(ver<10?2:3)<=cap) break; }
  if(ver>10) throw new Error('too long');
  const cap=raw(ver)-ECC[ver]*BLK[ver], size=ver*4+17;
  const bits=[]; const put=(v,n)=>{ for(let i=n-1;i>=0;i--) bits.push((v>>>i)&1); };
  put(4,4); put(data.length, ver<10?8:16); data.forEach(b=>put(b,8));
  put(0,Math.min(4,cap*8-bits.length)); while(bits.length%8) bits.push(0);
  const cw=[]; for(let i=0;i<bits.length;i+=8) cw.push(parseInt(bits.slice(i,i+8).join(''),2));
  for(let p=0xEC;cw.length<cap;p^=0xEC^0x11) cw.push(p);
  const mul=(x,y)=>{ let z=0; for(let i=7;i>=0;i--){ z=(z<<1)^((z>>>7)*0x11D); z^=((y>>>i)&1)*x; } return z&255; };
  const d=ECC[ver]; let div=new Array(d).fill(0); div[d-1]=1; let root=1;
  for(let i=0;i<d;i++){ for(let j=0;j<d;j++){ div[j]=mul(div[j],root); if(j+1<d) div[j]^=div[j+1]; } root=mul(root,2); }
  const rem=bl=>{ const r=new Array(d).fill(0); bl.forEach(b=>{ const f=b^r.shift(); r.push(0); div.forEach((c,i)=>{ r[i]^=mul(c,f); }); }); return r; };
  const nb=BLK[ver], rc=raw(ver), ns=nb-rc%nb, sl=Math.floor(rc/nb), blocks=[]; let k=0;
  for(let i=0;i<nb;i++){ const dl=sl-d+(i<ns?0:1); const dat=cw.slice(k,k+dl); k+=dl; const e=rem(dat); if(i<ns) dat.push(0); blocks.push(dat.concat(e)); }
  const out=[]; for(let i=0;i<blocks[0].length;i++) blocks.forEach((b,j)=>{ if(i!==sl-d||j>=ns) out.push(b[i]); });
  const M=Array.from({length:size},()=>new Array(size).fill(0)), F=Array.from({length:size},()=>new Array(size).fill(false));
  const set=(x,y,v)=>{ M[y][x]=v?1:0; F[y][x]=true; };
  for(let i=0;i<size;i++){ set(6,i,i%2===0); set(i,6,i%2===0); }
  const finder=(cx,cy)=>{ for(let dy=-4;dy<=4;dy++) for(let dx=-4;dx<=4;dx++){ const x=cx+dx,y=cy+dy; if(x<0||y<0||x>=size||y>=size) continue; const dist=Math.max(Math.abs(dx),Math.abs(dy)); set(x,y,dist!==2&&dist!==4); } };
  finder(3,3); finder(size-4,3); finder(3,size-4);
  if(ver>1){ const na=Math.floor(ver/7)+2, step=Math.ceil((ver*4+4)/(na*2-2))*2; const pos=[6]; for(let p=size-7;pos.length<na;p-=step) pos.splice(1,0,p);
    pos.forEach((cx,i)=>pos.forEach((cy,j)=>{ if((i===0&&j===0)||(i===0&&j===na-1)||(i===na-1&&j===0)) return; for(let dy=-2;dy<=2;dy++) for(let dx=-2;dx<=2;dx++) set(cx+dx,cy+dy,Math.max(Math.abs(dx),Math.abs(dy))!==1); })); }
  const fmt=m=>{ const dd=(0<<3)|m; let r=dd; for(let i=0;i<10;i++) r=(r<<1)^((r>>>9)*0x537); const b=((dd<<10)|r)^0x5412; const g=i=>((b>>>i)&1)!==0;
    for(let i=0;i<=5;i++) set(8,i,g(i)); set(8,7,g(6)); set(8,8,g(7)); set(7,8,g(8)); for(let i=9;i<15;i++) set(14-i,8,g(i));
    for(let i=0;i<8;i++) set(size-1-i,8,g(i)); for(let i=8;i<15;i++) set(8,size-15+i,g(i)); set(8,size-8,true); };
  fmt(0);
  if(ver>=7){ let r=ver; for(let i=0;i<12;i++) r=(r<<1)^((r>>>11)*0x1F25); const b=(ver<<12)|r; for(let i=0;i<18;i++){ const v=((b>>>i)&1)!==0, a=size-11+i%3, c=Math.floor(i/3); set(a,c,v); set(c,a,v); } }
  let bi=0; for(let right=size-1;right>=1;right-=2){ if(right===6) right=5; for(let vert=0;vert<size;vert++) for(let j=0;j<2;j++){ const x=right-j, up=((right+1)&2)===0, y=up?size-1-vert:vert; if(!F[y][x]&&bi<out.length*8){ M[y][x]=(out[bi>>>3]>>>(7-(bi&7)))&1; bi++; } } }
  const MASK=[(x,y)=>(x+y)%2===0,(x,y)=>y%2===0,(x,y)=>x%3===0,(x,y)=>(x+y)%3===0,(x,y)=>(Math.floor(x/3)+Math.floor(y/2))%2===0,(x,y)=>x*y%2+x*y%3===0,(x,y)=>(x*y%2+x*y%3)%2===0,(x,y)=>((x+y)%2+x*y%3)%2===0];
  const apply=m=>{ for(let y=0;y<size;y++) for(let x=0;x<size;x++) if(!F[y][x]&&MASK[m](x,y)) M[y][x]^=1; };
  const penalty=()=>{ let p=0, dark=0;
    for(let t=0;t<2;t++){ for(let a=0;a<size;a++){ let run=1; const g=i=>t?M[i][a]:M[a][i]; const line=[]; for(let i=0;i<size;i++) line.push(g(i));
      for(let i=1;i<size;i++){ if(line[i]===line[i-1]){ run++; if(run===5) p+=3; else if(run>5) p++; } else run=1; }
      const s=line.join(''); const re=/10111010000|00001011101/g; let m; while((m=re.exec(s))){ p+=40; re.lastIndex=m.index+1; } } }
    for(let y=0;y<size;y++) for(let x=0;x<size;x++){ if(M[y][x]) dark++; if(x<size-1&&y<size-1&&M[y][x]===M[y][x+1]&&M[y][x]===M[y+1][x]&&M[y][x]===M[y+1][x+1]) p+=3; }

const H = REMOTE ? Object.assign({apikey:KEY, 'Content-Type':'application/json'}, KEY.startsWith('eyJ')?{Authorization:'Bearer '+KEY}:{}) : {};
async function rest(path, opt={}){
  const r = await fetch(BASE_URL+'/rest/v1/'+path, {...opt, headers:{...H, ...(opt.headers||{})}});
  if(!r.ok) throw new Error(await r.text());
  const t = await r.text(); return t? JSON.parse(t): null;
}

function speak(text, rate=.85){
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text); u.lang='en-US'; u.rate=rate;
    const v = speechSynthesis.getVoices().find(v=>/en[-_]US/i.test(v.lang)); if(v) u.voice=v;
    speechSynthesis.speak(u);
  }catch(e){ toast('이 기기에서는 소리를 읽어 주지 못해요.'); }
}

async function startRec(){
  try{
    const st = await navigator.mediaDevices.getUserMedia({audio:true});
    const mr = new MediaRecorder(st, {audioBitsPerSecond:24000}); const chunks=[];
    mr.ondataavailable = e=>chunks.push(e.data);
    mr.onstop = async ()=>{
      st.getTracks().forEach(t=>t.stop());
      const blob = new Blob(chunks,{type:mr.mimeType||'audio/webm'});
      const b64 = await new Promise(res=>{ const f=new FileReader(); f.onload=()=>res(String(f.result).split(',')[1]); f.readAsDataURL(blob); });
      S.rec = {blob, b64, mime:blob.type, url:URL.createObjectURL(blob), state:'done'}; viewRec();
    };
    S.rec = {blob:null,b64:null,mime:'',url:null,state:'rec', mr, t0:Date.now()}; viewRec(); mr.start();
    S.rec.tick = setInterval(()=>{
      const sec=(Date.now()-S.rec.t0)/1000; const m=$('#meter i'); if(m) m.style.width=Math.min(100,sec/REC_MAX_SEC*100)+'%';
      if(sec>=REC_MAX_SEC) stopRec();
    },200);
  }catch(e){ toast('마이크를 쓸 수 없어요. 선생님께 알려요.'); }
}
function stopRec(){ if(S.rec.mr && S.rec.state==='rec'){ clearInterval(S.rec.tick); S.rec.mr.stop(); } }

function checkLine(k, t){
  t=(t||'').trim(); if(!t) return '';
  if(/[가-힣]/.test(t)) return '영어로 써 주세요. 모르면 오른쪽 보기를 누르거나 📖 사전에서 찾아 봐요.';
  if(/(^|\s)i(\s|$|')/.test(t)) return '"I"(나)는 항상 대문자예요.';
  if(k==='thanks' && /^your\b/i.test(t)) return '"your"는 이미 앞에 있어요. help처럼 낱말만 써요.';
  if(k==='thanks' && /^[a-z]+ing\b/i.test(t) && words(t)<=3) return 'Thank you for your 다음에는 help, kindness처럼 이름 낱말이 잘 어울려요.';
  return '';
}
function drawChecks(){ ORDER.forEach(k=>{ const el=document.getElementById('ck-'+k); if(el) el.textContent=checkLine(k,S.draft[k]); }); }
function setField(k, v, replace){
  const cur=S.draft[k]||''; S.draft[k] = replace||!cur? v : cur.replace(/\s+$/,'')+' '+v;
  const inp=document.querySelector(`.card input[data-k="${k}"]`); if(inp){ inp.value=S.draft[k]; inp.focus(); }
  S.focus=k; drawChecks();
}
function bindChips(root){
  document.querySelectorAll(root+' [data-w]').forEach(c=> c.onclick=()=>setField(S.focus, c.dataset.w, true));
  document.querySelectorAll(root+' [data-drag]').forEach(c=> c.ondragstart=e=>e.dataTransfer.setData('text/plain', c.dataset.drag));
}

/* ===== 전국 감사 지도 : 모든 반·학교의 카드가 한 장씩 쌓여요 (내용은 보이지 않고 위치만) ===== */
const KR_MAIN=[[126.68,37.78],[126.40,37.78],[126.10,37.70],[126.35,37.50],[126.60,37.40],[126.70,37.10],[126.85,36.95],[126.30,36.95],[126.15,36.75],[126.50,36.60],[126.55,36.25],[126.70,36.00],[126.55,35.70],[126.45,35.40],[126.35,35.10],[126.40,34.80],[126.30,34.55],[126.55,34.30],[127.00,34.40],[127.30,34.60],[127.50,34.75],[127.80,34.95],[128.10,34.90],[128.50,34.95],[128.70,35.05],[129.05,35.10],[129.35,35.45],[129.45,35.90],[129.45,36.30],[129.40,36.80],[129.20,37.15],[129.05,37.55],[128.75,37.90],[128.55,38.20],[128.37,38.62],[128.00,38.55],[127.60,38.50],[127.20,38.30],[126.95,38.05]];
const MK=88, MX0=124.1, MY0=43.1;
const mproj=(lo,la)=>[(lo-MX0)*MK*0.8,(MY0-la)*MK];
/* 3·1운동 때는 하나의 나라였으므로 한반도 전체 윤곽으로 그려요 (남쪽 해안 → 동해안 북쪽 → 두만강·압록강 → 서해안 북쪽) */
const KR_ALL = KR_MAIN.slice(0,35).concat(
  [[128.0,38.9],[127.45,39.15],[127.65,39.85],[128.4,40.3],[129.2,40.7],[129.8,41.75],[130.66,42.28],[130.1,42.9],[129.0,42.4],[128.1,42.0],[128.2,41.4],[127.2,41.45],[126.3,41.1],[125.4,40.55],[124.4,40.05],[124.7,39.65],[125.2,39.55],[125.35,38.75],[125.1,38.45],[124.85,38.2],[125.4,37.95],[125.7,37.9],[126.2,37.95],[126.5,37.9]]);
const KR_P = KR_ALL.map(p=>mproj(p[0],p[1]));
const JRX=0.45*0.8*MK, JRY=0.17*MK;
const JEJU = mproj(126.55,33.38), ULL=mproj(130.9,37.5), DOK=mproj(131.87,37.24);
function hash32(str){ let h=2166136261; for(let i=0;i<str.length;i++){ h^=str.charCodeAt(i); h=Math.imul(h,16777619); } return h>>>0; }
function rng32(seed){ let a=seed; return ()=>{ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function inPoly(x,y,P){ let c=false; for(let i=0,j=P.length-1;i<P.length;j=i++){ const a=P[i], b=P[j]; if((a[1]>y)!==(b[1]>y) && x<(b[0]-a[0])*(y-a[1])/(b[1]-a[1])+a[0]) c=!c; } return c; }
const KR_BOX = (()=>{ const xs=KR_P.map(p=>p[0]), ys=KR_P.map(p=>p[1]); return [Math.min(...xs),Math.max(...xs),Math.min(...ys),Math.max(...ys)]; })();
function dotPos(id){
  const r=rng32(hash32(id));
  if(r()<0.04){ const a=r()*6.283, d=Math.sqrt(r()); return [JEJU[0]+Math.cos(a)*d*JRX, JEJU[1]+Math.sin(a)*d*JRY]; }
  for(let k=0;k<80;k++){ const x=KR_BOX[0]+r()*(KR_BOX[1]-KR_BOX[0]), y=KR_BOX[2]+r()*(KR_BOX[3]-KR_BOX[2]); if(inPoly(x,y,KR_P)) return [x,y]; }
  return [(KR_BOX[0]+KR_BOX[1])/2,(KR_BOX[2]+KR_BOX[3])/2];
}
async function allCards(){
  if(REMOTE) return rest('ty_cards?select=id,class_code,created_at,hidden&hidden=eq.false&order=created_at.asc&limit=10000');
  return memStore.cards.filter(c=>!c.hidden).map(c=>({id:c.id,class_code:c.class_code,created_at:c.created_at}));
}
const MILES=[50,100,200,300,500,1000,2000,5000,10000];
const KR_AREA = (()=>{ let a=0; for(let i=0,j=KR_P.length-1;i<KR_P.length;j=i++) a+=(KR_P[j][0]+KR_P[i][0])*(KR_P[j][1]-KR_P[i][1]); return Math.abs(a/2)+Math.PI*JRX*JRY; })();
/* 카드 위치 : 카드마다 정해진 자리 (앞선 카드와 최대한 떨어진 후보를 골라 골고루 퍼지게). 새 카드가 와도 기존 카드는 움직이지 않아요 */
function dotLayout(list){
  const pts=[];
  for(let k=0;k<list.length;k++){
    const id=list[k].id; let best=null, bd=-1;
    const tries = k<1500? 7 : 1;
    for(let t=0;t<tries;t++){
      const p = dotPos(id+(t?'#'+t:''));
      let d=1e9; if(tries>1){ for(let i=Math.max(0,k-1500);i<k;i++){ const dx=pts[i][0]-p[0], dy=pts[i][1]-p[1]; const q=dx*dx+dy*dy; if(q<d) d=q; } }
      if(d>bd){ bd=d; best=p; }
    }
    pts.push(best);
  }
  return pts;
}
function mapSVG(list){
  const n=list.length;
  /* 카드가 적으면 크게, 많으면 작게 : 편지들이 지도의 약 35%를 덮도록 크기를 정해요 */
  const sz=Math.max(3,Math.min(70,Math.sqrt(0.35*KR_AREA/(1.5*Math.max(n,1)))));
  const sw=Math.max(.8,Math.min(3,sz*0.06));
  const poly=KR_P.map(p=>p.map(v=>v.toFixed(1)).join(',')).join(' ');
  const newest=new Set(list.slice(-4).map(c=>c.id));
  const pos=dotLayout(list);
  const dots=list.map((c,k)=>{ const [x,y]=pos[k], mine=S.code&&c.class_code===S.code, w=sz*1.5, h=sz*1.05, rot=((hash32(c.id)%17)-8);
    const col=mine?'#A9741E':'#233A52';
    return `<g class="${newest.has(c.id)?'pulse':''}" data-id="${c.id}" style="cursor:pointer" transform="translate(${x.toFixed(1)},${y.toFixed(1)}) rotate(${rot}) translate(${(-w/2).toFixed(1)},${(-h/2).toFixed(1)})"><rect width="${w.toFixed(1)}" height="${h.toFixed(1)}" rx="${(sz*.05).toFixed(1)}" fill="${mine?'#F2D9A0':'#FFFDF6'}" stroke="${col}" stroke-width="${sw.toFixed(2)}"/><polyline points="0,0 ${(w/2).toFixed(1)},${(h*.62).toFixed(1)} ${w.toFixed(1)},0" fill="none" stroke="${col}" stroke-width="${(sw*.8).toFixed(2)}"/>${sz>=26?`<circle cx="${(w/2).toFixed(1)}" cy="${(h*.62).toFixed(1)}" r="${(sz*.09).toFixed(1)}" fill="#A9741E"/>`:''}</g>`; }).join('');
  return `<svg class="mapsvg" viewBox="-10 -10 600 880" preserveAspectRatio="xMidYMid meet" role="img" aria-label="감사 편지 지도">
    <polygon points="${poly}" fill="#EDE6D3" stroke="#233A52" stroke-width="2" stroke-linejoin="round"/>
    <ellipse cx="${JEJU[0]}" cy="${JEJU[1]}" rx="${JRX.toFixed(1)}" ry="${JRY.toFixed(1)}" fill="#EDE6D3" stroke="#233A52" stroke-width="2"/>
    <circle cx="${ULL[0]}" cy="${ULL[1]}" r="5" fill="#EDE6D3" stroke="#233A52" stroke-width="2"/>
    <circle cx="${DOK[0]}" cy="${DOK[1]}" r="2.5" fill="#EDE6D3" stroke="#233A52" stroke-width="2"/>${dots}</svg>`;
}
function mapSide(list){
  const n=list.length, rooms=new Set(list.map(c=>c.class_code)).size;
  const next=MILES.find(m=>m>n)||n, prev=[0,...MILES].filter(m=>m<=n).pop();
  const pct=Math.round((n-prev)/Math.max(1,next-prev)*100);
  return `<div class="mapside"><div class="small">지금까지 모인 감사 카드</div><div class="big">${n}<span style="font-size:.35em"> 장</span></div>
    <div>${rooms}개 반이 함께 썼어요</div>
    <div><div class="small" style="margin-bottom:4px">다음 목표 ${next}장까지</div><div class="bar"><i style="width:${pct}%"></i></div></div>
    <div class="leg">✉ 편지 한 통이 카드 한 장이에요. ${S.code?'<b style="color:#A9741E">금색</b>은 우리 반이에요.':''}<br>편지를 누르면 내용을 읽어 볼 수 있어요.</div></div>`;
}

}
function viewMap(){
  $('#app').innerHTML=`<div class="mapview"><div class="maphead"><h2>감사 편지 지도</h2><span class="small">3·1운동 때는 하나의 나라였어요 · 카드가 한 장씩 한반도를 채워요</span><span style="flex:1"></span><button class="btn ghost" id="mapAdm" style="padding:6px 16px;font-size:15px">${S.adminPin?'🔑 삭제 모드 켜짐 (끄기)':'🔑 관리자'}</button> <button class="btn ghost" id="mapBack" style="padding:6px 16px;font-size:15px">← 돌아가기</button></div><div class="mapbody" id="mapBody"><div class="empty">불러오는 중…</div></div></div>`;
  $('#mapAdm').onclick=async()=>{
    if(S.adminPin){ S.adminPin=null; viewMap(); return; }
    const pin=prompt('관리자 비밀번호'); if(!pin) return;
    const ses=await api.sessionLogin('',pin);
    if(!ses||ses.error||ses.role!=='admin'){ toast('관리자 비밀번호가 달라요.'); return; }
    S.adminPin=ses.token; toast('편지를 누르면 내용을 보고 지울 수 있어요.'); viewMap();
  };
  $('#mapBack').onclick=()=>{ S.screen=S.teacher?(S.code?'wall':'dash'):(S.code&&S.num!=null)?'wall':'entry'; render(); };
  loadMap();
}

function render(){
  setWho();
  if(S.timer){ clearInterval(S.timer); S.timer=null; }
  ({entry:viewEntry, write:viewWrite, deco:viewDeco, rec:viewRec, wall:viewWall, map:viewMap, dash:viewDash}[S.screen])();
  if(S.screen==='map') S.timer=setInterval(loadMap, 15000);
  if(S.screen==='wall') S.timer=setInterval(async()=>{ if($('#modalRoot').innerHTML) return; await refresh(); viewWall(); }, 8000);
}
function teacherModal(){
  $('#modalRoot').innerHTML=`<div class="mask" id="mask"><div class="modal" style="max-width:460px">
    <h3 id="tTitle">🔑 교사 로그인</h3>
    <label class="small">아이디</label><input id="tId" autocomplete="off" placeholder="예 : olivia" style="width:100%;margin-bottom:8px">
    <label class="small">비밀번호</label><input id="tPw" type="password" style="width:100%;margin-bottom:8px">
    <div id="tNew" style="display:none;background:#FBF4E2;border-radius:10px;padding:10px 12px;margin-bottom:8px">
      <div class="small" style="margin-bottom:6px"><b>처음이세요?</b> 아이디(영어·숫자 2~20자)와 비밀번호(4자 이상)를 정하고, 안내받은 교사 등록 코드를 입력해요.</div>
      ${REMOTE?`<input id="tReg" type="password" placeholder="교사 등록 코드" style="width:100%">`:'<div class="small">연습 모드에서는 등록 코드가 필요 없어요.</div>'}
    </div>
    <div class="warn" id="tWarn"></div>
    <div style="display:flex;gap:8px;align-items:center;margin-top:10px"><button class="btn ghost" id="tSwitch" style="padding:6px 14px;font-size:14px">처음이에요 (계정 만들기)</button><span style="flex:1"></span><button class="btn ghost" id="tCancel" style="padding:6px 18px">닫기</button><button class="btn" id="tGo" style="padding:6px 22px">로그인</button></div></div></div>`;
  let signup=false; const warn=t=>{ $('#tWarn').textContent=t; };
  $('#tCancel').onclick=()=>{ $('#modalRoot').innerHTML=''; };
  $('#tSwitch').onclick=()=>{ signup=!signup; $('#tNew').style.display=signup?'block':'none'; $('#tTitle').textContent=signup?'👩‍🏫 교사 계정 만들기':'🔑 교사 로그인'; $('#tGo').textContent=signup?'계정 만들기':'로그인'; $('#tSwitch').textContent=signup?'이미 계정이 있어요':'처음이에요 (계정 만들기)'; warn(''); };
  $('#tGo').onclick=async()=>{
    const tid=$('#tId').value.trim().toLowerCase(), pw=$('#tPw').value;
    if(!pw){ warn('비밀번호를 써 주세요.'); return; }
    if(signup && !tid){ warn('아이디를 써 주세요.'); return; }
    $('#tGo').disabled=true; warn('');
    let ses=null;
    try{
      if(signup){
        if(pw.length<4){ warn('비밀번호는 4자 이상으로 정해 주세요.'); $('#tGo').disabled=false; return; }
        try{ ses=await api.signup(REMOTE?$('#tReg').value:'',tid,pw); }
        catch(e){ const m=String(e.message||e); warn(m.includes('forbidden')?'교사 등록 코드가 달라요.':m.includes('exists')?'이미 있는 아이디예요. 다른 아이디를 써 주세요.':m.includes('bad id')?'아이디는 영어 소문자·숫자·-,_ 2~20자로 써 주세요.':'계정을 만들지 못했어요.'); $('#tGo').disabled=false; return; }
      } else {
        ses=await api.sessionLogin(tid,pw);
        if(ses&&ses.error){ warn('연결이 안 돼요. 키와 주소를 확인해 주세요.'); $('#tGo').disabled=false; return; }
        if(!ses){ warn('아이디나 비밀번호가 달라요.'); $('#tGo').disabled=false; return; }
      }
    }catch(e){ warn('연결이 안 돼요. 키와 주소를 확인해 주세요.'); $('#tGo').disabled=false; return; }
    S.pin=ses.token; S.tid=ses.tid; S.adminPin=ses.role==='admin'?ses.token:null; S.teacher=true; S.code=''; S.num=0;
    $('#modalRoot').innerHTML=''; S.screen='dash'; render();
  };
  $('#tPw').addEventListener('keydown',e=>{ if(e.key==='Enter') $('#tGo').click(); });
}
$('#teacherBtn').onclick=teacherModal;

const stuLink=code=>location.origin+location.pathname+'?code='+encodeURIComponent(code);
function showQR(code){
  const url=stuLink(code); let svg=''; try{ svg=qrSVG(url,300); }catch(e){ svg='<div class="small">QR을 만들지 못했어요. 아래 주소를 알려 주세요.</div>'; }
  $('#modalRoot').innerHTML=`<div class="mask" id="mask"><div class="modal" style="max-width:520px;text-align:center">
    <div class="small">휴대폰이나 크롬북 카메라로 찍으면 바로 들어와요</div>
    <div style="margin:8px auto;width:min(300px,52vh);height:min(300px,52vh)">${svg.replace(/width="\d+" height="\d+"/,'width="100%" height="100%"')}</div>
    <div style="font-size:30px;font-weight:700;letter-spacing:2px;color:#233A52">${esc(code)}</div>
    <div class="small" style="word-break:break-all;margin:4px 0 10px">${esc(url)}</div>
    <div style="display:flex;gap:8px;justify-content:center"><button class="btn ghost" id="qCopy" style="padding:6px 16px">주소 복사</button><button class="btn" id="qClose" style="padding:6px 22px">닫기</button></div></div></div>`;
  $('#qClose').onclick=closeModal; $('#mask').onclick=e=>{ if(e.target.id==='mask') closeModal(); };
  $('#qCopy').onclick=async()=>{ try{ await navigator.clipboard.writeText(url); toast('복사했어요.'); }catch(e){ toast('길게 눌러 복사해 주세요.'); } };
}
async function viewDash(){
  $('#app').innerHTML=`<div class="dash"><div class="wallhead"><h2>내 반 ${S.adminPin?'<span class="small">(관리자 : 전체 반)</span>':''}</h2><span style="flex:1"></span><button class="btn ghost" id="dMap" style="padding:6px 16px;font-size:15px">🗺 감사 지도</button></div>
    <div class="panel" style="margin:10px 0"><b>＋ 새 반 만들기</b> <span class="small">(학교 영어 이름 + 학년 + 반, 예 : HAPPY51)</span>
      <div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap"><input id="dCode" maxlength="20" placeholder="HAPPY51" style="max-width:240px"><button class="btn" id="dMake" style="padding:6px 20px">만들기</button><span class="warn" id="dWarn" style="margin:0"></span></div></div>
    <div id="dList"><div class="empty">불러오는 중…</div></div></div>`;
  $('#dMap').onclick=()=>{ S.screen='map'; render(); };
  const load=async()=>{
    let rooms=[]; try{ rooms=await api.myRooms()||[]; }catch(e){ $('#dList').innerHTML='<div class="empty">불러오지 못했어요. 다시 로그인해 주세요.</div>'; return; }
    $('#dList').innerHTML=rooms.length? `<div class="dgrid">${rooms.map(r=>`<div class="dcard"><div style="font-size:24px;font-weight:700;color:#233A52">${esc(r.class_code)}</div><div class="small">카드 ${r.n}장${S.adminPin&&r.owner?' · '+esc(r.owner):''}</div>
      <div style="display:flex;gap:6px;margin-top:8px"><button class="btn" data-open="${esc(r.class_code)}" style="padding:5px 14px;font-size:15px">열기</button><button class="btn gold" data-qr="${esc(r.class_code)}" style="padding:5px 14px;font-size:15px">📱 QR</button></div></div>`).join('')}</div>` : '<div class="empty">아직 만든 반이 없어요. 위에서 반 코드를 만들어 보세요.</div>';
    document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{ S.code=b.dataset.open; S.teacher=true; S.num=0; S.tf='all'; enter(); });
    document.querySelectorAll('[data-qr]').forEach(b=>b.onclick=()=>showQR(b.dataset.qr));
  };
  $('#dMake').onclick=async()=>{
    const code=$('#dCode').value.trim().toUpperCase().replace(/\s+/g,''); const w=$('#dWarn');
    if(!/^[A-Z0-9]{3,20}$/.test(code)){ w.textContent='영어 대문자·숫자 3~20자로 써 주세요.'; return; }
    try{ await api.createRoom(code); $('#dCode').value=''; w.textContent=''; await load(); showQR(code); }
    catch(e){ const m=String(e.message||e); w.textContent=m.includes('exists')?'이미 있는 반 코드예요.':m.includes('forbidden')?'로그인이 끝났어요. 다시 로그인해 주세요.':'만들지 못했어요.'; }
  };
  load();
}
$('#outBtn').onclick=()=>{ api.logout(); S.code=''; S.num=null; S.teacher=false; S.pin=null; S.adminPin=null; S.tid=''; S.stoken=null; S.screen='entry'; S.read=new Set(); S.draft={to:'Mr. Taylor',thanks:'',youare:'',becauseof:'',withoutyou:'',will:'',bg:'hanji',sticker:'🕊️'}; render(); };

if(!REMOTE){ $('#demoBar').style.display='block'; demoLoad(); }
try{ speechSynthesis.getVoices(); }catch(e){}
if(new URLSearchParams(location.search).has('map')) S.screen='map';
render();
</script>
</body>
</html>
